name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit-subject gate walks the pushed range

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate skill sources and inventory
        run: python scripts/validate_repository.py

      - name: Lint shipped shell scripts
        run: shellcheck -S warning skills/*/evals/*.sh scripts/*.sh

      - name: Check the sync-agents-instructions config validator against its fixtures
        run: bash skills/sync-agents-instructions/evals/check.sh

      - name: Check commit subjects follow type(scope) subject
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then RANGE="origin/$BASE..HEAD"; else RANGE="$BEFORE..$GITHUB_SHA"; fi
          bash scripts/check-commit-subjects.sh "$RANGE"
