name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  # Superseded PR runs may cancel; release-tag validation finishes.
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A release tag may reuse a fresh complete PR/tag check of this exact SHA.
  # The checkout below tests the PR head itself so the evidence identity agrees.
  # Failed, cancelled, stale or unrecognized evidence reruns the short gate.
  dedupe:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
      evidence: ${{ steps.check.outputs.evidence }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          tested=false
          query_failed=false
          if pages=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?filter=all&per_page=100") &&
            jq -e --arg current "$RUN_ID" '[.[].check_runs[]
              | select(.app.id == 15368 and (.name == "ci-ok" or (.name | endswith(" / ci-ok"))))
              | select((.details_url // "" | contains("/actions/runs/" + $current + "/")) | not)] as $runs
              | ($runs | length) > 0 and all($runs[]; .status == "completed" and .conclusion == "success")' <<<"$pages" >/dev/null; then
            if ids=$(jq -r --arg current "$RUN_ID" '[.[].check_runs[]
                | select(.app.id == 15368 and (.name == "ci-ok" or (.name | endswith(" / ci-ok"))))
                | .details_url | capture("/actions/runs/(?<id>[0-9]+)/").id
                | select(. != $current)] | unique[]' <<<"$pages"); then
              for id in $ids; do
                if ! run=$(gh api "repos/$REPO/actions/runs/$id"); then
                  query_failed=true
                  continue
                fi
                if jq -e --arg sha "$SHA" '.head_sha == $sha
                    and (.path == ".github/workflows/ci.yml" or .path == ".github/workflows/release.yml")
                    and (.event == "pull_request" or .event == "push")
                    and .status == "completed" and .conclusion == "success"
                    and (.run_started_at | fromdateiso8601) > (now - 72 * 3600)' <<<"$run" >/dev/null; then
                  attempt=$(jq -r '.run_attempt' <<<"$run")
                  if ! jobs=$(gh api --paginate --slurp "repos/$REPO/actions/runs/$id/attempts/$attempt/jobs?per_page=100"); then
                    query_failed=true
                    continue
                  fi
                  if jq -e 'any(.[].jobs[]; (.name == "validate" or (.name | endswith(" / validate")))
                      and .status == "completed" and .conclusion == "success")' <<<"$jobs" >/dev/null; then
                    tested=true
                    evidence=$(jq -r '.html_url' <<<"$run")
                  fi
                fi
              done
            fi
          else
            echo "::warning::check-run query failed; running the full gate"
          fi
          [ "$query_failed" = false ] || tested=false
          echo "tested=$tested" | tee -a "$GITHUB_OUTPUT"
          echo "evidence=${evidence:-}" >> "$GITHUB_OUTPUT"

  validate:
    needs: dedupe
    if: ${{ !cancelled() && needs.dedupe.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # commit-subject gate walks the pushed range
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.21'
          enable-cache: true

      - name: Install the locked repository environment
        run: uv sync --locked

      - name: Set up Node for commitlint
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Validate skill sources and inventory
        run: scripts/validate_repository.py

      - name: Lint shipped shell scripts
        run: shellcheck -S warning skills/*/evals/*.sh scripts/*.sh

      - name: Check the sync-agents-instructions config validator against its fixtures
        run: bash skills/sync-agents-instructions/evals/check.sh

      - name: Check deterministic regressions without model calls
        run: bash scripts/check-offline.sh

      - name: Check formatting (ruff, prettier, shfmt)
        run: bash scripts/format.sh --check

      - name: Check commit subjects with commitlint
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then RANGE="origin/$BASE..HEAD"; else RANGE="$BEFORE..$GITHUB_SHA"; fi
          bash scripts/check-commit-subjects.sh "$RANGE"

  # PR/tag result and release-reuse evidence, not a master admission rule.
  # Failure and cancellation must remain visible even when a dependency skips.
  ci-ok:
    if: always()
    needs: [dedupe, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every needed job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          DEDUPE_RESULT: ${{ needs.dedupe.result }}
          TESTED: ${{ needs.dedupe.outputs.tested }}
          EVIDENCE: ${{ needs.dedupe.outputs.evidence }}
        run: |
          printf '%s\n' "$NEEDS"
          case "$DEDUPE_RESULT" in
            success | skipped) ;;
            *) echo "::error::dedupe concluded $DEDUPE_RESULT"; exit 1 ;;
          esac
          if [ "$TESTED" = true ]; then
            echo "该 SHA 已由 ${EVIDENCE} 验证"
            exit 0
          fi
          results=$(jq -r 'to_entries[] | select(.key != "dedupe") | "\(.key)=\(.value.result)"' <<<"$NEEDS")
          [ -n "$results" ] || exit 1
          for entry in $results; do
            [ "${entry#*=}" = success ] || { echo "::error::needed job ${entry%%=*} concluded ${entry#*=}"; exit 1; }
          done
