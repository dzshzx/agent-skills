name: Release tag verification

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  ci:
    # ci.yml's dedupe job declares checks: read; a caller must grant every
    # permission a nested job requests, even when that job is skipped.
    permissions:
      contents: read
      checks: read
      actions: read
    uses: ./.github/workflows/ci.yml

  verify-tag:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv (Python from .python-version)
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: '0.12.19'

      - name: Verify immutable release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-list -n1 "refs/tags/$RELEASE_TAG")" = "$RELEASE_SHA"
          git fetch --no-tags origin +master:refs/remotes/origin/master
          git merge-base --is-ancestor "$RELEASE_SHA" origin/master
          uv run --script --locked scripts/version_plan.py verify \
            --repository dzshzx/agent-skills \
            --target "v=${RELEASE_TAG#v}" \
            --tag-ref "refs/tags/$RELEASE_TAG"
