# Repo-relative surface forms that must be rejected: a directory (trailing /),
# a backslash separator, and a readonly surface listed twice under two spellings.
[workspace]
project_globs = ["~/workspace/*"]
off_limits = []

[[shared_sources]]
path = "~/.config/agent-instructions/shared.md"
role = "machine facts"
domain = "machine-facts"
load = "always"

[[agents]]
name = "codex"
entry_file = "~/.codex/AGENTS.md"
always_load_mode = "mandatory-entry-read"
project_instruction_file = "AGENTS.md"

[[agents]]
name = "claude-code"
entry_file = "~/.claude/CLAUDE.md"
always_load_mode = "native"
project_instruction_file = "CLAUDE.md/"

[[agents]]
name = "gemini"
entry_file = "~/.gemini/GEMINI.md"
always_load_mode = "native"
project_instruction_file = "sub\\GEMINI.md"

[[agents]]
name = "kimi-code"
entry_file = "~/.kimi-code/AGENTS.md"
always_load_mode = "mandatory-entry-read"
project_instruction_file = ".kimi-code/AGENTS.md"
readonly_project_surfaces = ["AGENTS.md", "./AGENTS.md"]
