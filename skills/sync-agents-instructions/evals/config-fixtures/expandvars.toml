# Machine paths may use $VAR: check.sh exports SYNC_FIXTURE_DIR to this
# directory, so both files exist once the variable is expanded.
[workspace]
project_globs = ["~/workspace/*"]

[[shared_sources]]
path = "$SYNC_FIXTURE_DIR/valid.toml"
role = "machine facts"
domain = "machine-facts"
load = "always"

[[agents]]
name = "codex"
entry_file = "$SYNC_FIXTURE_DIR/minimal.toml"
always_load_mode = "mandatory-entry-read"
project_instruction_file = "AGENTS.md"
