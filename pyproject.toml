# Repository tooling environment: offline regressions and eval helpers run
# through `uv run --locked`. Shipped skill scripts carry their own PEP 723
# header and `*.py.lock` instead.
[project]
name = "agent-skills-dev"
version = "0.0.0"
# Development and CI select 3.14 through .python-version; shipped scripts keep their own requirements.
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "python-frontmatter==1.3.0",
  "semver==3.1.0",
]

[tool.uv]
package = false
